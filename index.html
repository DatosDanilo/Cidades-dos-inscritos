  playUpdate(dt);placeCam();const hr=sinopHour();roofNear=dist<340;roofs.concat(roofsFix).forEach(r=>{r.visible=roofVis(r)});atmos(hr);const rn=MORADORES.filter(m=>!/\s/.test(m.u)).length;if(rn!==resN)assignWalkers(rn);const nVis=Math.round(resN*walkAct(hr));
  airplay(now/1000);movers.forEach(mv=>carState(mv,hr));bizCars.forEach(c=>{c.visible=hr>=7.5&&hr<19});walkers.forEach((w,wi)=>{const vis=wi<nVis&&w.on;w.g.visible=vis;if(!vis){w.x=w.z=1e9;return}walkStep(w,dt,hr>=20.5||hr<5.5)});
  if(ring.visible)ring.scale.setScalar(ringK*(1+.07*Math.sin(now/200)));
  renderer.render(scene,cam);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
loadSheet();setInterval(loadSheet,60000);
</script>
